[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindweave-backend"
version = "0.1.0"
description = "MindWeave (心络) — Privacy-first relationship memory & companion backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "sse-starlette>=2.1.3",
    "pyyaml>=6.0.2",
    "lunar-python>=1.3.8",
    "pillow>=11.0.0",
    "google-genai>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "import-linter>=2.1",
    "hypothesis>=6.115.0",
    "schemathesis>=3.38.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mindweave", "evals"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = [
    "E501",    # handled by formatter / long Chinese literals
    "B008",    # FastAPI Depends() in argument defaults
    "S101",    # assert allowed in tests and internal invariants
    "RUF001",  # full-width Chinese punctuation is intentional in domain prompts/copy
    "RUF002",  # full-width Chinese punctuation in docstrings
    "RUF003",  # full-width Chinese punctuation in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "S603"]
"evals/**" = ["S105", "S106", "S311", "S603"]
"src/mindweave/ai/adapters/fake.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mindweave"]
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "lunar_python.*",
    "PIL.*",
    "google.*",
    "sse_starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
