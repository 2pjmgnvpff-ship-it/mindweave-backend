<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FCFBF9" />
  <meta name="description" content="心络 · 把在意的人，轻轻记在手帐里" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="心络" />
  <title>心络</title>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <style>
    html,body{margin:0;padding:0;background:#FCFBF9;color:#231E1B;height:100%;overflow:hidden;}
    .mw-boot-veil{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#FCFBF9;font-family:"Songti SC","STSong",Georgia,serif;font-size:22px;letter-spacing:.12em;color:#231E1B;transition:opacity 220ms ease;}
    .mw-boot-veil.is-gone{opacity:0;pointer-events:none;display:none;}
  </style>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/journal.css" />
  <link rel="stylesheet" href="./styles/dock.css" />
</head>
<body>
  <div class="mw-stage">
    <main class="mw-viewport" id="app" data-journal-edition="cotton" data-view-mode="person-journal" data-arrow-tier="gold">
      <div class="mw-boot-veil" id="bootVeil" aria-hidden="true">心络</div>

      <section class="splash-screen" id="authScreen" aria-label="登录心络" hidden></section>
      <section class="onboarding-stage" id="onboarding" aria-label="初次见面" hidden></section>

      <div class="journal-atelier-canvas" id="journalCanvas">
        <div class="mw-atelier-canvas" aria-hidden="true"></div>
        <div class="mw-edge-fade-top" aria-hidden="true"></div>
        <div class="mw-edge-fade-bottom" aria-hidden="true"></div>

        <header class="mw-topbar" id="topbar">
          <button type="button" class="mw-icon-btn quiet-gear-btn" id="settingsBtn" aria-label="我的设置"></button>
          <div class="mw-topbar-pill" id="folioBar">
            <button type="button" class="folio-subject-btn" id="folioSubjectBtn" aria-label="切换人物或翻看封面">
              <span class="folio-subject" id="folioSubject"></span>
            </button>
            <button type="button" class="folio-month-btn" id="folioMonthBtn" aria-label="切换手帐视图" hidden>
              <span id="folioMonthLabel"></span>
            </button>
          </div>
          <div class="mw-topbar-right">
            <button type="button" class="mw-icon-btn quiet-search-btn" id="searchToggleBtn" aria-label="搜索手帐" hidden></button>
            <div class="top-right-arrow-pin-anchor" id="arrowAnchor"></div>
          </div>
        </header>

        <div class="spotlight-bar" id="spotlightBar" hidden>
          <span class="spotlight-icon" id="spotlightIcon" aria-hidden="true"></span>
          <input type="search" class="spotlight-input" id="spotlightInput" placeholder="在手帐里找一句…" autocomplete="off" aria-label="搜索这一页手帐" />
          <span class="spotlight-count tabular" id="spotlightCount" hidden></span>
          <button type="button" class="mw-icon-btn spotlight-close" id="spotlightClose" aria-label="关闭搜索"></button>
        </div>

        <div class="journal-scroll" id="journalScroll" role="region" aria-label="手帐页"></div>
        <div class="ghost-spine" id="ghostSpine" aria-label="时间轴快速定位" hidden></div>
        <button type="button" class="question-entry" id="questionEntry" hidden></button>
      </div>

      <p class="sr-only" id="voiceLive" role="status" aria-live="polite"></p>
      <div class="fly-layer" id="flyLayer" aria-hidden="true"></div>

      <div class="voice-inline-capsule" id="voiceInlineCapsule" aria-hidden="true"></div>
      <div class="capture-receipt-pill" id="captureReceipt" role="status" aria-live="polite"></div>
      <div class="inner4-tray" id="inner4Tray" role="dialog" aria-label="常用人物快速切换"></div>

      <nav class="mw-dock" id="dock" aria-label="主操作">
        <div class="dock-capsule" id="capsule" role="group" aria-label="语音速记与切换人物"></div>
        <button type="button" class="dock-ai-orb" id="aiOrb" aria-label="和丘比特聊聊"></button>
      </nav>

      <section class="ai-chat-fullscreen" id="chat" role="dialog" aria-modal="true" aria-label="和丘比特聊聊" hidden></section>
      <div class="mw-peek-layer" id="peekLayer"></div>
      <div class="mw-sheet-layer" id="sheetLayer"></div>
      <div class="mw-toast-host" id="toastHost" role="status" aria-live="polite"></div>
    </main>
  </div>
  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
